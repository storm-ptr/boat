name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UBUNTU_ARTIFACT: ugis.ubuntu-26.04.x64.deb
  WINDOWS_ARTIFACT: ugis.windows.x64
  WINDOWS_ARCHIVE: ugis.windows.x64.zip

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      - name: Resolve the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download the Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail

          run_id=$(gh run list \
            --workflow windows.yml \
            --branch main \
            --commit "$TARGET_SHA" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "A successful Windows main build is required for $TARGET_SHA" >&2
            exit 1
          fi

          mkdir windows-artifact
          gh run download "$run_id" \
            --name "$WINDOWS_ARTIFACT" \
            --dir windows-artifact
          (cd windows-artifact && zip --recurse-paths "../$WINDOWS_ARCHIVE" .)
          unzip -t "$WINDOWS_ARCHIVE"

      - name: Download and version the Ubuntu package
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail

          run_id=$(gh run list \
            --workflow ubuntu.yml \
            --branch main \
            --commit "$TARGET_SHA" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "A successful Ubuntu main build is required for $TARGET_SHA" >&2
            exit 1
          fi

          mkdir ubuntu-artifact
          gh run download "$run_id" \
            --name "$UBUNTU_ARTIFACT" \
            --dir ubuntu-artifact
          mv "ubuntu-artifact/$UBUNTU_ARTIFACT" .

          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[0-9][0-9A-Za-z.+~-]*$ ]]
          work=$(mktemp --directory)
          trap 'rm -rf "$work"' EXIT
          dpkg-deb --raw-extract "$UBUNTU_ARTIFACT" "$work/root"
          sed -i "s/^Version: .*/Version: $version/" "$work/root/DEBIAN/control"
          dpkg-deb --build --root-owner-group \
            "$work/root" "$work/$UBUNTU_ARTIFACT"
          mv "$work/$UBUNTU_ARTIFACT" "$UBUNTU_ARTIFACT"
          test "$(dpkg-deb --field "$UBUNTU_ARTIFACT" Version)" = "$version"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
          gh release create \
            "$GITHUB_REF_NAME" \
            "$WINDOWS_ARCHIVE" \
            "$UBUNTU_ARTIFACT" \
            --draft \
            --verify-tag \
            --title "ugis $GITHUB_REF_NAME" \
            --notes "Windows x64 and Ubuntu 26.04 x64 builds of ugis."
