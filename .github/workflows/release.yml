name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APPVEYOR_PROJECT: https://ci.appveyor.com/api/projects/storm-ptr/boat
  LINUX_ARTIFACT: ugis.ubuntu.x64.deb
  WINDOWS_ARTIFACT: ugis.windows.x64.zip

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      - name: Resolve the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download the Windows artifact
        env:
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail

          history=$(curl --fail --silent --show-error \
            "$APPVEYOR_PROJECT/history?recordsNumber=100&branch=main")
          version=$(jq -r --arg sha "$TARGET_SHA" \
            '[.builds[] | select(.commitId == $sha and .status == "success")][0].version // empty' \
            <<< "$history")
          if [[ -z "$version" ]]; then
            echo "A successful AppVeyor main build is required for $TARGET_SHA" >&2
            exit 1
          fi

          build=$(curl --fail --silent --show-error \
            "$APPVEYOR_PROJECT/build/$version")
          job_id=$(jq -r --arg sha "$TARGET_SHA" \
            'select(.build.commitId == $sha and .build.status == "success") |
             [.build.jobs[] | select(.status == "success")][0].jobId // empty' \
            <<< "$build")
          if [[ -z "$job_id" ]]; then
            echo "AppVeyor build no longer matches the tagged commit" >&2
            exit 1
          fi

          api=https://ci.appveyor.com/api
          artifacts=$(curl --fail --silent --show-error \
            "$api/buildjobs/$job_id/artifacts")
          jq -e --arg name "$WINDOWS_ARTIFACT" \
            '.[] | select(.fileName == $name)' <<< "$artifacts" > /dev/null
          curl --fail --location --silent --show-error \
            "$api/buildjobs/$job_id/artifacts/$WINDOWS_ARTIFACT" \
            --output "$WINDOWS_ARTIFACT"
          unzip -t "$WINDOWS_ARTIFACT"

      - name: Download and version the Ubuntu package
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail

          run_id=$(gh run list \
            --workflow linux.yml \
            --branch main \
            --commit "$TARGET_SHA" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "A successful Linux main build is required for $TARGET_SHA" >&2
            exit 1
          fi

          mkdir linux-artifact
          gh run download "$run_id" \
            --name "$LINUX_ARTIFACT" \
            --dir linux-artifact
          mv "linux-artifact/$LINUX_ARTIFACT" .

          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[0-9][0-9A-Za-z.+~-]*$ ]]
          work=$(mktemp --directory)
          trap 'rm -rf "$work"' EXIT
          dpkg-deb --raw-extract "$LINUX_ARTIFACT" "$work/root"
          sed -i "s/^Version: .*/Version: $version/" "$work/root/DEBIAN/control"
          dpkg-deb --build --root-owner-group \
            "$work/root" "$work/$LINUX_ARTIFACT"
          mv "$work/$LINUX_ARTIFACT" "$LINUX_ARTIFACT"
          test "$(dpkg-deb --field "$LINUX_ARTIFACT" Version)" = "$version"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
          gh release create \
            "$GITHUB_REF_NAME" \
            "$WINDOWS_ARTIFACT" \
            "$LINUX_ARTIFACT" \
            --draft \
            --verify-tag \
            --title "ugis $GITHUB_REF_NAME" \
            --notes "Windows x64 and Ubuntu 26.04 x64 builds of ugis."
