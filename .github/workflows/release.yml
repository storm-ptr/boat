name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UBUNTU_ARTIFACT: ugis.ubuntu-26.04.deb
  WINDOWS_ARTIFACT: ugis.windows
  WINDOWS_ARCHIVE: ugis.windows.zip

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download the Windows artifact
        uses: dawidd6/action-download-artifact@v27
        with:
          workflow: windows.yml
          commit: ${{ steps.commit.outputs.sha }}
          event: push
          workflow_conclusion: success
          name: ${{ env.WINDOWS_ARTIFACT }}
          path: windows-artifact

      - name: Archive the Windows artifact
        run: |
          set -euo pipefail
          (cd windows-artifact && zip --recurse-paths "../$WINDOWS_ARCHIVE" .)
          unzip -t "$WINDOWS_ARCHIVE"

      - name: Download the Ubuntu package
        uses: dawidd6/action-download-artifact@v27
        with:
          workflow: ubuntu.yml
          commit: ${{ steps.commit.outputs.sha }}
          event: push
          workflow_conclusion: success
          name: ${{ env.UBUNTU_ARTIFACT }}
          path: ubuntu-artifact

      - name: Version the Ubuntu package
        run: |
          set -euo pipefail
          mv "ubuntu-artifact/$UBUNTU_ARTIFACT" .
          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[0-9][0-9A-Za-z.+~-]*$ ]]
          work=$(mktemp --directory)
          trap 'rm -rf "$work"' EXIT
          dpkg-deb --raw-extract "$UBUNTU_ARTIFACT" "$work/root"
          sed -i "s/^Version: .*/Version: $version/" "$work/root/DEBIAN/control"
          dpkg-deb --build --root-owner-group \
            "$work/root" "$work/$UBUNTU_ARTIFACT"
          mv "$work/$UBUNTU_ARTIFACT" "$UBUNTU_ARTIFACT"
          test "$(dpkg-deb --field "$UBUNTU_ARTIFACT" Version)" = "$version"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1
          gh release create \
            "$GITHUB_REF_NAME" \
            "$WINDOWS_ARCHIVE" \
            "$UBUNTU_ARTIFACT" \
            --verify-tag \
            --title "ugis $GITHUB_REF_NAME" \
            --notes "Windows and Ubuntu 26.04 builds of ugis."
