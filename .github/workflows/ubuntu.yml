name: Ubuntu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UGIS_PACKAGE: ugis.ubuntu-26.04.deb

jobs:
  build:
    name: Build and test on Ubuntu 26.04
    runs-on: ubuntu-26.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: Password12!
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=Password12!"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: Password12!
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-15 \
            g++-15 \
            dpkg-dev \
            make \
            pkg-config \
            qmake6 \
            qt6-base-dev \
            libboost-dev \
            libcurl4-openssl-dev \
            libgdal-dev \
            libjpeg-dev \
            default-libmysqlclient-dev \
            libpng-dev \
            libpq-dev \
            libspatialite-dev \
            libsqlite3-dev \
            libtbb-dev \
            libwxgtk3.2-dev \
            odbc-postgresql \
            unixodbc-dev \
            xauth \
            xvfb

      - name: Build and smoke-test ugis
        working-directory: example/ugis
        run: |
          qmake6 ugis.pro QMAKE_CC=gcc-15 QMAKE_CXX=g++-15
          make --jobs="$(nproc)"
          test -x ugis
          timeout --kill-after=5s 10s xvfb-run --auto-servernum ./ugis && status=$? || status=$?
          [ "$status" -eq 124 ] || { echo "ugis exited unexpectedly with status $status" >&2; exit 1; }

      - name: Test
        working-directory: test
        run: make --file=linux.makefile --jobs="$(nproc)" test CXX=g++-15

      - name: Test Qt GUI
        working-directory: test/gui/qt
        run: |
          qmake6 test.pro QMAKE_CC=gcc-15 QMAKE_CXX=g++-15 \
            "DEFINES+=BOAT_TEST_PASSWORD=Password12! BOAT_TEST_MYSQL_HOST=127.0.0.1 BOAT_TEST_POSTGRES_HOST=localhost"
          make
          xvfb-run --auto-servernum ./run --log_level=unit_scope

      - name: Test wx GUI
        working-directory: test/gui/wx
        run: make --file=linux.makefile test CXX=g++-15

      - name: Build the Ubuntu package
        run: |
          version="0.0.0+git${GITHUB_RUN_NUMBER}.${GITHUB_SHA::8}"
          root="$GITHUB_WORKSPACE/$UGIS_PACKAGE.tmp"
          work="$(mktemp --directory)"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$work/debian"
          strip --strip-unneeded example/ugis/ugis
          install -m 0755 example/ugis/ugis "$root/usr/bin/ugis"
          {
            echo "Source: ugis"
            echo "Section: science"
            echo "Priority: optional"
            echo "Maintainer: Andrew Naplavkov <storm-ptr@users.noreply.github.com>"
            echo ""
            echo "Package: ugis"
            echo "Architecture: any"
            echo "Depends: \${shlibs:Depends}"
            echo "Description: Universal GIS application"
          } > "$work/debian/control"
          depends=$(cd "$work" && dpkg-shlibdeps --package=ugis -O "$root/usr/bin/ugis" \
            | sed -n 's/^shlibs:Depends=//p')
          {
            echo "Package: ugis"
            echo "Version: $version"
            echo "Section: science"
            echo "Priority: optional"
            echo "Architecture: $(dpkg --print-architecture)"
            echo "Maintainer: Andrew Naplavkov <storm-ptr@users.noreply.github.com>"
            echo "Depends: $depends"
            echo "Homepage: https://github.com/storm-ptr/boat"
            echo "Description: Universal GIS application"
            echo " ugis is a desktop application for viewing and working with geospatial data."
          } > "$root/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$root" "$UGIS_PACKAGE"
          dpkg-deb --info "$UGIS_PACKAGE"
          dpkg-deb --contents "$UGIS_PACKAGE"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UGIS_PACKAGE }}
          path: ${{ env.UGIS_PACKAGE }}
          if-no-files-found: error

  verify-package:
    name: Verify the Ubuntu package
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.UGIS_PACKAGE }}

      - name: Install and verify the package
        run: |
          sudo apt-get update
          sudo apt-get install --yes "./$UGIS_PACKAGE" xauth xvfb
          test "$(command -v ugis)" = "/usr/bin/ugis"
          dpkg-query --show --showformat='${Status}\n${Version}\n' ugis
          timeout --kill-after=5s 10s xvfb-run --auto-servernum ugis && status=$? || status=$?
          [ "$status" -eq 124 ] || { echo "installed ugis exited unexpectedly with status $status" >&2; exit 1; }
