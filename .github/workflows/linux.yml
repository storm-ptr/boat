name: Linux

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ugis:
    name: Build ugis on Ubuntu 26.04
    runs-on: ubuntu-26.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: Password12!
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=Password12!"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: Password12!
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-15 \
            g++-15 \
            dpkg-dev \
            make \
            pkg-config \
            qmake6 \
            qt6-base-dev \
            libboost-dev \
            libcurl4-openssl-dev \
            libgdal-dev \
            libjpeg-dev \
            default-libmysqlclient-dev \
            libpng-dev \
            libpq-dev \
            libspatialite-dev \
            libsqlite3-dev \
            libtbb-dev \
            libwxgtk3.2-dev \
            odbc-postgresql \
            unixodbc-dev \
            xauth \
            xvfb

      - name: Configure ugis
        working-directory: example/ugis
        run: qmake6 ugis.pro QMAKE_CC=gcc-15 QMAKE_CXX=g++-15

      - name: Build ugis
        working-directory: example/ugis
        run: make --jobs=2

      - name: Verify the executable
        working-directory: example/ugis
        run: test -x ugis

      - name: Smoke-test ugis
        working-directory: example/ugis
        run: |
          status=0
          timeout --kill-after=5s 10s xvfb-run --auto-servernum ./ugis || status=$?
          if [ "$status" -ne 124 ]; then
            echo "ugis exited unexpectedly with status $status" >&2
            exit 1
          fi

      - name: Build tests
        working-directory: test
        run: make --file=linux.makefile --jobs=2 CXX=g++-15

      - name: Run autonomous tests
        working-directory: test
        run: make --file=linux.makefile test-autonomous CXX=g++-15

      - name: Run SQLite tests
        working-directory: test
        run: make --file=linux.makefile test-sqlite CXX=g++-15

      - name: Run PostgreSQL tests
        working-directory: test
        run: make --file=linux.makefile test-postgres CXX=g++-15

      - name: Run MySQL tests
        working-directory: test
        run: make --file=linux.makefile test-mysql CXX=g++-15

      - name: Run PostgreSQL ODBC tests
        working-directory: test
        run: make --file=linux.makefile test-odbc-postgres CXX=g++-15

      - name: Run local GDAL vector tests
        working-directory: test
        run: make --file=linux.makefile test-gdal-local CXX=g++-15

      - name: Run PostgreSQL GDAL vector tests
        working-directory: test
        run: make --file=linux.makefile test-gdal-postgres CXX=g++-15

      - name: Configure Qt GUI test
        working-directory: test/gui/qt
        run: >-
          qmake6 test.pro QMAKE_CC=gcc-15 QMAKE_CXX=g++-15
          "DEFINES+=BOAT_TEST_PASSWORD=Password12!
          BOAT_TEST_MYSQL_HOST=127.0.0.1
          BOAT_TEST_POSTGRES_HOST=localhost"

      - name: Build Qt GUI test
        working-directory: test/gui/qt
        run: make --jobs=2

      - name: Run Qt GUI test
        working-directory: test/gui/qt
        run: xvfb-run --auto-servernum ./run --log_level=unit_scope

      - name: Build wx GUI test
        working-directory: test/gui/wx
        run: make --file=linux.makefile --jobs=2 CXX=g++-15

      - name: Run wx GUI test
        working-directory: test/gui/wx
        run: make --file=linux.makefile test CXX=g++-15

      - name: Build the Ubuntu package
        run: |
          version="0.0.0+git${GITHUB_RUN_NUMBER}.${GITHUB_SHA::8}"
          bash packaging/build-deb.sh \
            example/ugis/ugis \
            "$version" \
            ugis.ubuntu.x64.deb
          dpkg-deb --info ugis.ubuntu.x64.deb
          dpkg-deb --contents ugis.ubuntu.x64.deb

      - name: Upload the Ubuntu package
        uses: actions/upload-artifact@v7
        with:
          name: ugis.ubuntu.x64.deb
          path: ugis.ubuntu.x64.deb
          if-no-files-found: error

  verify-package:
    name: Verify the Ubuntu package
    needs: build-ugis
    runs-on: ubuntu-26.04
    steps:
      - name: Download the Ubuntu package
        uses: actions/download-artifact@v7
        with:
          name: ugis.ubuntu.x64.deb

      - name: Install the package and its dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ./ugis.ubuntu.x64.deb xauth xvfb

      - name: Verify the installed package
        run: |
          test "$(command -v ugis)" = "/usr/bin/ugis"
          dpkg-query --show --showformat='${Status}\n${Version}\n' ugis
          status=0
          timeout --kill-after=5s 10s xvfb-run --auto-servernum ugis || status=$?
          if [ "$status" -ne 124 ]; then
            echo "installed ugis exited unexpectedly with status $status" >&2
            exit 1
          fi
