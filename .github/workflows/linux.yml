name: Linux

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ugis:
    name: Build ugis on Ubuntu 26.04
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-15 \
            g++-15 \
            make \
            pkg-config \
            qmake6 \
            qt6-base-dev \
            libboost-dev \
            libcurl4-openssl-dev \
            libgdal-dev \
            libjpeg-dev \
            default-libmysqlclient-dev \
            libpng-dev \
            libpq-dev \
            libspatialite-dev \
            libsqlite3-dev \
            libtbb-dev \
            unixodbc-dev \
            xauth \
            xvfb

      - name: Configure ugis
        working-directory: example/ugis
        run: qmake6 ugis.pro QMAKE_CC=gcc-15 QMAKE_CXX=g++-15

      - name: Build ugis
        working-directory: example/ugis
        run: make --jobs=2

      - name: Verify the executable
        working-directory: example/ugis
        run: test -x ugis

      - name: Smoke-test ugis
        working-directory: example/ugis
        run: |
          status=0
          timeout --kill-after=5s 10s xvfb-run --auto-servernum ./ugis || status=$?
          if [ "$status" -ne 124 ]; then
            echo "ugis exited unexpectedly with status $status" >&2
            exit 1
          fi
